name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Tạo project
        run: xcodegen generate
      - name: Build (không ký)
        run: |
          xcodebuild -project RadarScan.xcodeproj -scheme RadarScan \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Đóng gói IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RadarScan.app Payload/
          zip -r RadarScan.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RadarScan-ipa
          path: RadarScan.ipa
