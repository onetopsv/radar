name: RadarScan
options:
  bundleIdPrefix: com.radarwifi
  deploymentTarget:
    iOS: "15.0"
targets:
  RadarScan:
    type: application
    platform: iOS
    sources: [RadarScan]
    info:
      path: RadarScan/Info.plist
      properties:
        CFBundleDisplayName: Radar WiFi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBonjourServices: [_companion-link._tcp, _device-info._tcp, _airplay._tcp, _raop._tcp, _googlecast._tcp, _ipp._tcp, _hap._tcp, _apple-mobdev2._tcp, _smb._tcp]
        NSLocationWhenInUseUsageDescription: Cần quyền Vị trí để iOS cho phép đọc tên mạng WiFi hiện tại.
        NSLocalNetworkUsageDescription: Ứng dụng cần quyền mạng cục bộ để quét các thiết bị đang dùng chung WiFi.
    entitlements:
      path: RadarScan/RadarScan.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radarwifi.scan
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
